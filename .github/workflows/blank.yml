name: Palm Tungsten E2 Linux & Bootloader Pipeline

on:
  workflow_dispatch:

env:
  ARCH: arm
  CROSS_COMPILE: arm-none-eabi-
  PALMDEV: /opt/palm-sdk
  PATH: /tmp/prc-tools-remix/dist/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  build-tungsten-e2:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.18
      options: --privileged

    steps:
      - name: Install Alpine Build Dependencies
        run: |
          apk update
          apk add --no-cache \
            build-base \
            bash \
            git \
            autoconf \
            automake \
            libtool \
            texinfo \
            gawk \
            flex \
            bison \
            zlib-dev \
            ncurses-dev \
            bc \
            perl \
            gmp-dev \
            mpfr-dev \
            mpc1-dev \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi

      - name: Clone Palm OS SDK Headers
        run: |
          git clone --depth 1 https://github.com/jichu4n/palm-os-sdk.git /opt/palm-sdk

      - name: Clone prc-tools-remix
        run: |
          git clone --depth 1 https://github.com/jichu4n/prc-tools-remix.git /tmp/prc-tools-remix

      - name: Build & Install prc-tools-remix
        working-directory: /tmp/prc-tools-remix
        run: |
          chmod +x tools/build.sh
          ./tools/build.sh

      - name: Clone & Compile Cocoboot PRC
        run: |
          git clone https://github.com/hackndev/cocoboot.git /workspace/cocoboot
          cd /workspace/cocoboot
          make clean
          make

      - name: Clone & Compile Linux Kernel (linux-hnd for PXA256)
        run: |
          git clone https://github.com/hackndev/linux-hnd.git /workspace/linux-hnd
          cd /workspace/linux-hnd
          make pxa_defconfig
          make -j$(nproc) zImage

      - name: Generate SD Card Directory Structure & Config
        run: |
          mkdir -p /workspace/sdcard/PALM/Launcher
          
          # Copy Bootloader PRC
          cp /workspace/cocoboot/cocoboot.prc /workspace/sdcard/PALM/Launcher/
          
          # Copy Compiled Kernel Image
          cp /workspace/linux-hnd/arch/arm/boot/zImage /workspace/sdcard/zImage
          
          # Generate Cocoboot Configuration File
          cat << 'EOF' > /workspace/sdcard/cocoboot.conf
          kernel /zImage
          cmdline console=tty0 root=/dev/mmcblk0p2 rootfstype=ext2 rw rootwait
          EOF
          
          echo "Build pipeline completed successfully. Artifacts staged in /workspace/sdcard/"

      - name: Upload SD Card Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: palm-tungsten-e2-sdcard
          path: /workspace/sdcard/
